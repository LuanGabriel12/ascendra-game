name: ASCENDRA Backend CI (CARBON & NEON)

on:
  push:
    branches:
      - main
      - "feature/**"
      - "carbon/**"
      - "neon/**"
  pull_request:
    branches:
      - main
      - "feature/**"
      - "carbon/**"
      - "neon/**"

jobs:
  carbon-typescript:
    name: CARBON TypeScript (Typecheck & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck strict TypeScript
        run: npm run typecheck

      - name: Build TypeScript artifacts
        run: npm run build

  carbon-postgres-integration:
    name: CARBON PostgreSQL Integration & Demo
    runs-on: ubuntu-latest
    needs: [carbon-typescript]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ascendra_ci
          POSTGRES_PASSWORD: ascendra_ci_ephemeral_pw
          POSTGRES_DB: ascendra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ascendra_ci -d ascendra_ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://ascendra_ci:ascendra_ci_ephemeral_pw@localhost:5432/ascendra_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify full migration lifecycle dynamically (up -> down:all -> up)
        run: |
          npm run migrate:up
          npm run migrate:down:all
          npm run migrate:up

      - name: Run real PostgreSQL integration test suites
        run: npm test

      - name: Run reproducible Session 02..05 headless demonstrations
        run: |
          npm run demo:session02
          npm run demo:session03
          npm run demo:session04
          npm run demo:session05

  neon-go:
    name: NEON Go Simulation & Race Detector
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Go vet & build
        run: |
          go vet ./...
          go build ./...

      - name: Go unit & determinism tests
        run: go test -count=1 ./...

      - name: Go race detector suite
        run: go test -race -count=1 ./...

      - name: Run headless simulation harness
        run: go run ./cmd/sim
