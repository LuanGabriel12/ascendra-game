name: Backend CI (CARBON)

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Typecheck, Migrations & PostgreSQL Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ascendra_ci
          POSTGRES_PASSWORD: ascendra_ci_ephemeral_pw
          POSTGRES_DB: ascendra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ascendra_ci -d ascendra_ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://ascendra_ci:ascendra_ci_ephemeral_pw@localhost:5432/ascendra_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck strict TypeScript
        run: npm run typecheck

      - name: Verify migrations (up -> down -> up) on clean PostgreSQL
        run: |
          npm run migrate:up
          npm run migrate:down
          npm run migrate:up

      - name: Run integration tests against real PostgreSQL
        run: npm test

      - name: Build production TypeScript artifacts
        run: npm run build
