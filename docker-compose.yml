services:
  postgres:
    image: postgres:16-alpine
    container_name: ascendra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ascendra_app
      POSTGRES_PASSWORD: local_dev_only_password
      POSTGRES_DB: ascendra_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ascendra_app -d ascendra_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ascendra_pgdata:/var/lib/postgresql/data

volumes:
  ascendra_pgdata:
